# ----------------------------------------------------------------------------
# NETWORKS
# ----------------------------------------------------------------------------
networks:
  saga-network:
    driver: bridge                     # Default bridge driver
    ipam:
      config:
        - subnet: 172.20.0.0/16        # Private subnet for containers

# ----------------------------------------------------------------------------
# VOLUMES (Persistent Storage)
# ----------------------------------------------------------------------------
# Volumes persist data even when containers are removed
volumes:
  rabbitmq-data:        # RabbitMQ queue data
  order-db-data:        # Order database files
  payment-db-data:      # Payment database files
  inventory-db-data:    # Inventory database files
  redis-data:           # Redis cache data
  mongodb-data:         # MongoDB notification data
  prometheus-data:      # Time-series metrics data
  grafana-data:         # Dashboard configuration

services:
  # ==========================================================================
  # MESSAGE BROKER 1: RABBITMQ
  # ==========================================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine  # Alpine Linux = smaller image
    container_name: saga-rabbitmq
    ports:
      - "5672:5672"      # AMQP protocol port (for apps)
      - "15672:15672"    # Management UI port (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq    # Persist queues/messages
    networks:
      - saga-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MESSAGE BROKER 2: KAFKA + ZOOKEEPER (Alternative to RabbitMQ)
  # ==========================================================================
  # Kafka requires Zookeeper for cluster coordination
#  zookeeper:
#    image: confluentinc/cp-zookeeper:latest
#    container_name: saga-zookeeper
#    ports:
#      - "2181:2181"
#    environment:
#      ZOOKEEPER_CLIENT_PORT: 2181
#      ZOOKEEPER_TICK_TIME: 2000
#    networks:
#      - saga-network
#
#  kafka:
#    image: confluentinc/cp-kafka:latest
#    container_name: saga-kafka
#    ports:
#      - "9092:9092"      # Kafka broker port
#    environment:
#      KAFKA_BROKER_ID: 1
#      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181    # Connect to Zookeeper
#      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092  # External access
#      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1   # Single node cluster
#    depends_on:
#      - zookeeper
#    networks:
#      - saga-network

  # ==========================================================================
  # DATABASES (One per service - Database per Service pattern)
  # ==========================================================================
  # Order Service Database
  order-db:
    image: postgres:15-alpine          # Alpine = smaller image
    container_name: saga-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"                    # Expose for local development
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - saga-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Payment Service Database (Different port to avoid conflict)
  payment-db:
    image: postgres:15-alpine
    container_name: saga-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"                    # Different host port!
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - saga-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Inventory Service Database
  inventory-db:
    image: postgres:15-alpine
    container_name: saga-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5429:5432"                    # Different port again
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - saga-network
    healthcheck: # ADD THIS
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # CACHE LAYER: REDIS
  # ==========================================================================
  # Used for caching frequently accessed data (product, inventory, sessions)
  redis:
    image: redis:7-alpine
    container_name: saga-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes   # Enable persistence
    volumes:
      - redis-data:/data
    networks:
      - saga-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================================================
  # NOSQL DATABASE: MONGODB
  # ==========================================================================
  # Used by notification service for flexible document storage
  mongodb:
    image: mongo:7
    container_name: saga-notification-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: notification_db
    volumes:
      - mongodb-data:/data/db
    networks:
      - saga-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MICROSERVICES
  # ==========================================================================

  # --------------------------------------------------------------------------
  # ORDER SERVICE
  # --------------------------------------------------------------------------
  order-service:
    build: ./order-service              # Use Dockerfile in this directory
    container_name: saga-order-service
    ports:
      - "8045:8045"
    environment:
      - SERVER_PORT=8045
      # Database configuration
      - DB_HOST=order-db
      - DB_PORT=5432
      - DB_NAME=order_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      # RabbitMQ configuration
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USER=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      # Redis configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Optional Kafka (commented in docker-compose)
      - KAFKA_BROKERS=kafka:9092
      # Logging
      - LOG_LEVEL=DEBUG
    depends_on:                         # Start dependencies first
      rabbitmq:
        condition: service_healthy
      order-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saga-network
    # Resource limits prevent one service from consuming all resources
    deploy:
      resources:
        limits:
          memory: 512M                  # Max 512MB RAM
        reservations:
          memory: 256M                  # Guaranteed 256MB RAM

  # --------------------------------------------------------------------------
  # PAYMENT SERVICE
  # --------------------------------------------------------------------------
  payment-service:
    build: ./payment-service
    container_name: saga-payment-service
    ports:
      - "8046:8046"
    environment:
      # Database configuration
      - DB_HOST=payment-db
      - DB_PORT=5432
      - DB_NAME=payment_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      # RabbitMQ configuration
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USER=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      # Stripe API (from .env file)
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      # Logging
      - LOG_LEVEL=DEBUG
    depends_on:
      rabbitmq:
        condition: service_healthy
      payment-db:
        condition: service_healthy
    networks:
      - saga-network

  # --------------------------------------------------------------------------
  # INVENTORY SERVICE
  # --------------------------------------------------------------------------
  inventory-service:
    build: ./inventory-service
    container_name: saga-inventory-service
    ports:
      - "8047:8047"
    environment:
      # Database configuration
      - DB_HOST=inventory-db
      - DB_PORT=5432
      - DB_NAME=inventory_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_POOL_SIZE=20
      - DB_MIN_IDLE=10
      # RabbitMQ configuration
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USER=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      # Redis configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_TTL=300000
      - CACHE_TTL_MINUTES=5
      # Business configuration
      - RESERVATION_TIMEOUT_MINUTES=10
      - LOW_STOCK_THRESHOLD=10
      - CRITICAL_STOCK_THRESHOLD=5
      # Logging
      - LOG_LEVEL=DEBUG
    depends_on:
      rabbitmq:
        condition: service_healthy
      inventory-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saga-network

  # --------------------------------------------------------------------------
  # NOTIFICATION SERVICE
  # --------------------------------------------------------------------------
  notification-service:
    build: ./notification-service
    container_name: saga-notification-service
    ports:
      - "8048:8048"
    environment:
      # RabbitMQ configuration
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USER=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      # MongoDB configuration
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=notification_db
      # Email configuration (from .env file)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      # Logging
      - LOG_LEVEL=DEBUG
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - saga-network

  # ==========================================================================
  # MONITORING STACK (Prometheus + Grafana)
  # ==========================================================================
  # Prometheus collects metrics from all services
  prometheus:
    image: prom/prometheus:latest
    container_name: saga-prometheus
    ports:
      - "9090:9090"                    # Prometheus UI
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro  # Config file
      - prometheus-data:/prometheus    # Persist metrics
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - saga-network
    depends_on:
      - order-service
      - payment-service
      - inventory-service
      - notification-service

  # Grafana visualizes metrics from Prometheus
  grafana:
    image: grafana/grafana:latest
    container_name: saga-grafana
    ports:
      - "3020:3000"                    # Grafana UI
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin    # Default password
      GF_PLUGINS_PREINSTALL: grafana-piechart-panel #,grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - saga-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3020/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------------------
  # NODE EXPORTER - Host Metrics
  # --------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: saga-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - saga-network

  # --------------------------------------------------------------------------
  # ALERTMANAGER - Alerting
  # --------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: saga-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - saga-network
